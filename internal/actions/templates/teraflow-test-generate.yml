# TF-011: Test Generate
# Triggered by: implementation PR merged
# Action: Generate test skeletons from verified_by test specifications
name: teraflow-test-generate
on:
  pull_request:
    types: [closed]

concurrency:
  group: teraflow-test-generate-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  test-generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    if: github.event.pull_request.merged == true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Install teraflow
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            go build -o ./teraflow .
            mkdir -p "$(go env GOPATH)/bin"
            ln -sf "$(pwd)/teraflow" "$(go env GOPATH)/bin/teraflow"
          else
            go install github.com/taka-sho/teraflow@v0.5.0
            ln -sf "$(go env GOPATH)/bin/teraflow" ./teraflow
          fi
