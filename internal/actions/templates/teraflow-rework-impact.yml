# TF-012: Rework Impact Analysis
# Triggered by: Issue labeled with "rework-*"
# Action: teraflow rework create, post impact analysis comment
name: teraflow-rework-impact
on:
  issues:
    types: [labeled]

concurrency:
  group: teraflow-state-update
  cancel-in-progress: false

jobs:
  rework-impact:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    # Only run when a rework-* label is added
    if: startsWith(github.event.label.name, 'rework-') || github.event.label.name == 'rework-request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Pull latest state
        run: git pull --rebase origin main || true

      - uses: actions/setup-go@v5

        with:

          go-version: stable
          cache: false

      - name: Install teraflow

        run: |

          if [ "${{ github.event_name }}" = "pull_request" ]; then

            go build -o ./teraflow .

            mkdir -p "$(go env GOPATH)/bin"

            ln -sf "$(pwd)/teraflow" "$(go env GOPATH)/bin/teraflow"

          else

            go install github.com/taka-sho/teraflow@v0.5.0

            ln -sf "$(go env GOPATH)/bin/teraflow" ./teraflow

          fi
