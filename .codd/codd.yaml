# CoDD プロジェクト設定
version: "0.1.0"

project:
  name: "teraflow"
  language: "go"
  frameworks:
    - "cobra"
    - "goreleaser"

ai_command: "claude --print --model claude-opus-4-6 --tools \"\""
coding_principles: null

scan:
  source_dirs:
    - "cmd/"
    - "internal/"
    - "graphrag/"
  doc_dirs:
    - "docs/"
  config_files: []
  exclude:
    - "vendor/"
    - "dist/"
    - ".codd/scan/"

graph:
  store: "jsonl"
  path: "codd/scan"

bands:
  green:
    min_confidence: 0.90
    min_evidence_count: 2
  amber:
    min_confidence: 0.50

propagation:
  max_depth: 10
  stop_at_contract_boundary: true
