name: teraflow-impact-check

on:
  push:
    branches: [main]
    paths:
      - "docs/**/*.md"
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "docs/**/*.md"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  impact:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install teraflow
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            go build -o ./teraflow .
            mkdir -p "$(go env GOPATH)/bin"
            ln -sf "$(pwd)/teraflow" "$(go env GOPATH)/bin/teraflow"
          else
            go install github.com/taka-sho/teraflow@v0.5.0
            ln -sf "$(go env GOPATH)/bin/teraflow" ./teraflow
          fi
