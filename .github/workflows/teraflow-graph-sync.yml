name: teraflow-graph-sync

on:
  push:
    branches: [main]
    paths:
      - "docs/**/*.md"
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "docs/**/*.md"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  graph-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build teraflow
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            go build -o ./teraflow .
            mkdir -p "$(go env GOPATH)/bin"
            ln -sf "$(pwd)/teraflow" "$(go env GOPATH)/bin/teraflow"
          else
            go install github.com/taka-sho/teraflow@v0.5.0
            ln -sf "$(go env GOPATH)/bin/teraflow" ./teraflow
          fi
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'graphrag/pyproject.toml'
      - name: Install GraphRAG
        run: pip install ./graphrag
      - name: Build index
        run: ./teraflow index build --config .github/teraflow.yml
      - name: Incremental graph sync
        run: ./teraflow graph build --incremental --config .github/teraflow.yml
