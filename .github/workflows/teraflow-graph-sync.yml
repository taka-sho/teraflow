name: teraflow-graph-sync

on:
  push:
    branches: [main]
    paths:
      - "docs/**/*.md"
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "docs/**/*.md"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  graph-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build teraflow
        run: go build -o ./teraflow .
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'graphrag/pyproject.toml'
      - name: Install GraphRAG
        run: pip install ./graphrag
      - name: Build index
        run: ./teraflow index build --config .github/teraflow.yml
      - name: Incremental graph sync
        run: ./teraflow graph build --incremental --config .github/teraflow.yml
