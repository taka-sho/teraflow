name: Security

on:
  pull_request:
    paths-ignore:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/**'
      - 'internal/templates/**'
      - 'internal/actions/**'

concurrency:
  group: ${{ github.workflow }}-skip-${{ github.ref }}
  cancel-in-progress: false

jobs:
  security:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - run: echo "No relevant changes, skipping security."
