name: teraflow-validate

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build teraflow
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            go build -o ./teraflow .
            mkdir -p "$(go env GOPATH)/bin"
            ln -sf "$(pwd)/teraflow" "$(go env GOPATH)/bin/teraflow"
          else
            go install github.com/taka-sho/teraflow@v0.5.0
            ln -sf "$(go env GOPATH)/bin/teraflow" ./teraflow
          fi
      - name: Build index
        run: ./teraflow index build --config .github/teraflow.yml
      - name: Ensure graph.graphml
        run: |
          if [ -f .teraflow/graphrag/graph.graphml ]; then
            echo "graph.graphml found; using repository version"
          else
            if ! ./teraflow graph build --full --config .github/teraflow.yml; then
              echo "::warning::graph build failed in PR context; continuing with validate report"
            fi
          fi
      - name: Validate CoDD consistency
        run: |
          set +e
          ./teraflow validate --full --config .github/teraflow.yml
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "::warning::validate found CoDD issues (exit=${rc}). Reporting only in this workflow."
          fi
