name: teraflow-wave-generate

on:
  workflow_dispatch:
    inputs:
      phase:
        description: "Target phase"
        required: true
      wave_number:
        description: "Wave number (0 = all)"
        required: false
        default: "0"
  workflow_run:
    workflows: ["Phase Transition"]
    types: [completed]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  wave-generate:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install teraflow
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            go build -o ./teraflow .
            mkdir -p "$(go env GOPATH)/bin"
            ln -sf "$(pwd)/teraflow" "$(go env GOPATH)/bin/teraflow"
          else
            go install github.com/taka-sho/teraflow@v0.5.0
            ln -sf "$(go env GOPATH)/bin/teraflow" ./teraflow
          fi
