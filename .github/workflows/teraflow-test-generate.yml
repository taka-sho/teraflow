name: teraflow-test-generate

on:
  pull_request:
    types: [closed]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-generate:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build teraflow
        run: go build -o ./teraflow .
      - name: Check API key
        id: check_api
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::warning::ANTHROPIC_API_KEY is not set. Skipping LLM-dependent steps."
            echo "skip_llm=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip_llm=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Generate test skeletons
        if: steps.check_api.outputs.skip_llm != 'true'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          DESIGN_DOCS=$(echo "$PR_BODY" | grep -Eo 'docs/[a-zA-Z0-9_./-]+\.md' | sort -u || true)
          if [ -z "$DESIGN_DOCS" ]; then
            echo "No design docs referenced."
            exit 0
          fi
          while IFS= read -r design; do
            [ -z "$design" ] && continue
            [ -f "$design" ] || continue
            ./teraflow implement --design "$design" --parallel 1 --dry-run --config .github/teraflow.yml >/dev/null
          done <<EOF_DOCS
          $DESIGN_DOCS
          EOF_DOCS
      - name: Skip note
        if: steps.check_api.outputs.skip_llm == 'true'
        run: echo "LLM-dependent steps skipped."
