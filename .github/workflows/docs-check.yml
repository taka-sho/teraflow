name: Docs Check

on:
  pull_request:
    paths:
      - 'docs/**'
      - '*.md'
      - 'CLAUDE.md'

jobs:
  markdown-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@v23
        with:
          globs: |
            docs/**/*.md
            README.md
            CLAUDE.md
