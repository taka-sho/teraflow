name: CoDD Check

on:
  pull_request:

jobs:
  codd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install codd-dev
        run: pip install codd-dev
      - name: Run codd scan
        run: codd scan
