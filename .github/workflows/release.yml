name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  warmup-go-proxy:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - name: Force proxy.golang.org to fetch this tag
        env:
          GONOSUMCHECK: github.com/taka-sho/teraflow
          GONOSUMDB: github.com/taka-sho/teraflow
        run: |
          TAG="${GITHUB_REF_NAME}"
          MODULE="github.com/taka-sho/teraflow"

          # Use go list to force proxy to fetch the module.
          # curl alone may hit a cached 404 if proxy hasn't indexed the tag yet.
          echo "Registering ${MODULE}@${TAG} with Go proxy..."
          for attempt in 1 2 3 4 5; do
            if go list -m "${MODULE}@${TAG}" 2>/dev/null; then
              echo "Proxy registered ${MODULE}@${TAG} on attempt ${attempt}"
              break
            fi
            echo "Attempt ${attempt} failed, waiting 30s..."
            sleep 30
          done

          # Verify proxy HTTP endpoints are reachable
          for attempt in 1 2 3; do
            if curl -fsS "https://proxy.golang.org/${MODULE}/@v/${TAG}.info" -o /dev/null 2>/dev/null; then
              echo "Proxy HTTP endpoint confirmed for ${TAG}"
              exit 0
            fi
            echo "Proxy HTTP not ready yet (attempt ${attempt}), waiting 60s..."
            sleep 60
          done
          echo "::warning::Proxy HTTP endpoint not yet available. sum.golang.org may need more time to index."
          echo "smoke-test will use GONOSUMCHECK as fallback."

  smoke-test:
    needs: warmup-go-proxy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - name: go install this exact tag
        env:
          GOPROXY: https://proxy.golang.org,direct
          GONOSUMCHECK: github.com/taka-sho/teraflow
          GONOSUMDB: github.com/taka-sho/teraflow
        run: |
          TAG="${GITHUB_REF_NAME}"
          go install "github.com/taka-sho/teraflow@${TAG}"
          "$(go env GOPATH)/bin/teraflow" --version
      - name: Verify @latest resolves to this tag
        env:
          GOPROXY: https://proxy.golang.org,direct
          GONOSUMCHECK: github.com/taka-sho/teraflow
          GONOSUMDB: github.com/taka-sho/teraflow
        run: |
          TAG="${GITHUB_REF_NAME}"
          RESOLVED=$(go list -m -json "github.com/taka-sho/teraflow@latest" \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['Version'])")
          echo "Resolved @latest = $RESOLVED, expected = $TAG"
          if [ "$RESOLVED" != "$TAG" ]; then
            echo "::warning::go list @latest returned $RESOLVED but tag is $TAG"
            if [[ "$TAG" =~ - ]]; then
              echo "Tag is prerelease -- accepting mismatch"
              exit 0
            fi
            exit 1
          fi
