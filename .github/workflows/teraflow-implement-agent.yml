name: teraflow-implement-agent

on:
  issues:
    types: [labeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  implement-agent:
    if: ${{ github.event.label.name == 'agent-implement' || (startsWith(github.event.label.name, 'phase') && contains(github.event.label.name, 'implementation')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build teraflow
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            go build -o ./teraflow .
            mkdir -p "$(go env GOPATH)/bin"
            ln -sf "$(pwd)/teraflow" "$(go env GOPATH)/bin/teraflow"
          else
            go install github.com/taka-sho/teraflow@v0.5.0
            ln -sf "$(go env GOPATH)/bin/teraflow" ./teraflow
          fi
      - name: Check API key
        id: check_api
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::warning::ANTHROPIC_API_KEY is not set. Skipping LLM-dependent steps."
            echo "skip_llm=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip_llm=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Prepare modules from issue body
        if: steps.check_api.outputs.skip_llm != 'true'
        id: mods
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          MODULES=$(printf '%s' "$ISSUE_BODY" | grep -Eo '(internal|cmd|pkg|tests)/[a-zA-Z0-9_./-]+\.(go|py)' | sort -u || true)
          {
            echo "modules<<EOF"
            printf '%s\n' "$MODULES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Parallel implementation drafts
        if: steps.check_api.outputs.skip_llm != 'true' && steps.mods.outputs.modules != ''
        run: |
          printf '%s\n' "${{ steps.mods.outputs.modules }}" | xargs -I{} -P 3 sh -c '
            ./teraflow implement --module "{}" --parallel 3 --dry-run --config .github/teraflow.yml >/dev/null
          '
      - name: Post completion comment
        if: steps.check_api.outputs.skip_llm != 'true'
        run: |
          gh issue comment "${{ github.event.issue.number }}" --body "teraflow-implement-agent: implementation draft completed."
      - name: Skip note
        if: steps.check_api.outputs.skip_llm == 'true'
        run: echo "LLM-dependent steps skipped."
