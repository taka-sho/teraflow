version: "1"

project:
  name: "teraflow"
  description: ""
  repository: ""

confirmation:
  trigger: "確定"
  req_trigger: "要求確定"

ai:
  default_provider: anthropic

# エージェント種別ごとのAIプロバイダー・モデル設定（オプション）
# assignments 未設定または該当 type 未定義時は ai.default_provider にフォールバック
# サポート provider: anthropic / openai / claude-code / custom
assignments:
  requirements:                         # 要件定義・分析
    provider: anthropic
    model: claude-haiku-4-5-20251001
  review:                               # コードレビュー
    provider: anthropic
    model: claude-sonnet-4-6
  implement:                            # 実装エージェント
    provider: anthropic
    model: claude-haiku-4-5-20251001
  ci-fix:                               # CI修正エージェント
    provider: anthropic
    model: claude-haiku-4-5-20251001
  conflict:                             # コンフリクト解決
    provider: anthropic
    model: claude-haiku-4-5-20251001
  incident:                             # インシデント対応
    provider: anthropic
    model: claude-sonnet-4-6
  maintenance:                          # 定期メンテナンス
    provider: anthropic
    model: claude-haiku-4-5-20251001

hooks:
  on_discussion_created:
    - action: respond
      skill: requirements
      conditions:
        categories: ["要件定義", "Requirements"]
        not_author: ["github-actions[bot]"]

  on_discussion_comment:
    - action: respond
      skill: requirements
      conditions:
        categories: ["要件定義", "Requirements"]
        not_author: ["github-actions[bot]"]

  on_push:
    - action: index_update

rbac:
  enabled: false  # true にするとGitHub Actions上でRBACが有効化される
  admin_role: "admin"
  github_enforcement: false

  roles:
    - name: admin
      members: []  # GitHub usernamesを追加
      permissions: ["*"]

    - name: pm
      members: []
      permissions:
        - "gate.approve.*"
        - "stage.advance"
        - "rbac.apply"

    - name: dev
      members: []
      permissions:
        - "phase.start"
        - "phase.complete"
        - "rework.create"
        - "agent.run.*"

    - name: qa
      members: []
      permissions:
        - "gate.approve.testing"
        - "gate.approve.integration_test"

    - name: release_mgr
      members: []
      permissions:
        - "gate.approve.operation"
        - "stage.advance"
        - "constraint.force"

harness:
  score_threshold: 70
  auto_issue: false
