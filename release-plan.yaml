# teraflow リリース計画
# バージョン採番: vMAJOR.MINOR.PATCH
# MAJOR: 破壊的変更
# MINOR: 新機能（GraphRAG統合、V字モデル等）
# PATCH: バグ修正・改善

current_version: "v0.5.20"  # 最新リリース

roadmap:
  v0.6.0:
    theme: "他言語対応 + V字モデル検証強化"
    features:
      - i18n対応
      - CoDD enforcement実装
    target_date: null  # TBD

release_process:
  pre_release:
    - "feature branch で実装"
    - "go build/test pass"
    - "local binary build"
    - "canary E2E (--local-binary --repo taka-sho/teraflow-canary) all pass"
  approval:
    - "GitHub Actions approve-release.yml で手動承認"
  release:
    - "scripts/release.sh vX.X.X で PR+タグ作成"
    - "teraflow-check を新バージョンに更新"
