[project]
name = "teraflow-graphrag"
version = "0.1.0"
description = "GraphRAG module for teraflow - knowledge graph construction from CoDD documents"
requires-python = ">=3.11"
dependencies = [
    "networkx>=3.0",
    "graspologic>=3.0",
    "pyyaml>=6.0",
    "litellm>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-mock>=3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["teraflow_graphrag"]
