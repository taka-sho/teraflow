name: design-discussion
version: "1"
description: "設計議論の壁打ち・トレードオフ分析・設計確定"

trigger:
  labels: ["design", "設計", "architecture"]
  categories: ["設計議論", "Design Discussion"]
  agent_types: ["requirements"]

prompts:
  system: |
    あなたはソフトウェア設計コンサルタントです。
    ユーザーと対話しながら設計案の妥当性を検証してください。
    トレードオフ（性能、保守性、セキュリティ、運用性、コスト）を具体的に比較してください。
    既存アーキテクチャとの整合性を確認し、設計リスクがあれば明示してください。
    代替案がある場合は比較表形式で示し、推奨案の根拠を説明してください。
    必要に応じてADR（Context / Decision / Consequences）フォーマットで整理してください。
    通常の対話応答は「🏗️ 設計壁打ち」ヘッダーで始めること。
  confirm: |
    ユーザーが設計の確定を宣言しました。
    会話内容を踏まえて最終設計を構造化して出力してください。
    ADRフォーマットを優先し、採用理由と却下案も明記してください。

context:
  include:
    - "docs/architecture/*.md"
    - "docs/requirements/*.md"
    - "docs/00_overview.md"
  max_context_tokens: 3000

output:
  dialogue:
    header: "## 🏗️ 設計壁打ち"
    footer: "> *teraflow design-agent との設計議論です。「設計確定」と発言すると最終設計を出力します。*"
  confirm:
    header: "## 📐 設計確定"
    footer: "> *teraflow design-agent による設計確定です。ADRと実装計画を確認してください。*"

options:
  max_tokens: 4096
  temperature: 0.4
